# Configuration Netlify pour LaCDIA
# ================================
# Déploiement : connecter le repo GitHub/GitLab à Netlify
# ou utiliser `netlify deploy` en CLI

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_PUBLIC_SANITY_PROJECT_ID = "fghn7rpw"
  NEXT_PUBLIC_SANITY_DATASET = "production"
  NEXT_PUBLIC_SANITY_API_VERSION = "2024-01-01"

# Plugin Next.js pour Netlify
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Headers de sécurité
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Redirections pour le routage i18n
[[redirects]]
  from = "/api/*"
  to = "/api/:splat"
  status = 200

[[redirects]]
  from = "/studio/*"
  to = "/studio/:splat"
  status = 200
